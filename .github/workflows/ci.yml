name: CI

on:
  push:
  pull_request:

concurrency:
  group: ronin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-runtime:
    name: Python ${{ matrix.python-version }} / pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q ronin
      - name: Python / parser and metadata conformance
        run: pytest -q tests/test_parser_strictness.py tests/test_examples.py tests/test_agent_metadata.py
      - name: Python / numerical runtime and shared fixtures
        run: pytest -q tests/test_core.py tests/test_conformance_fixtures.py
      - name: Python / CLI, IR and REPL contracts
        run: pytest -q tests/test_cli_multisystem.py tests/test_cli_run.py tests/test_run_csv.py tests/test_compile_ir.py tests/test_repl.py
      - name: Check executable examples
        run: |
          ronin check examples/maquinas.ronin
          ronin check examples/maquinas_ces.ronin
          ronin check examples/pesca.ronin
          ronin check examples/degeneracy_active.ronin
          ronin check examples/degeneracy_inactive.ronin
      - name: Verify Maquinas normative output
        run: |
          ronin solve examples/maquinas.ronin > maquinas.json
          python -c "import json; d=json.load(open('maquinas.json')); assert abs(d['fitness'][0]-0.48)<1e-9; assert abs(d['fitness'][1]-0.20)<1e-9; assert abs(d['allocation'][0]-70.5882352941)<1e-7; assert abs(d['allocation'][1]-29.4117647059)<1e-7"
      - name: Verify degeneracy threshold example
        run: |
          ronin diagnose examples/degeneracy_inactive.ronin > diagnose.json
          python -c "import json; d=json.load(open('diagnose.json')); assert d['degeneracy']=='inactive'; assert d['omega_range_orders']>=3.0"

      - name: Smoke test documented practical quickstart
        run: |
          ronin list examples/maquinas.ronin
          ronin check examples/maquinas.ronin
          ronin solve examples/maquinas.ronin > quickstart-solve.json
          ronin run examples/maquinas.ronin > quickstart-run.json
          ronin run examples/maquinas.ronin --format csv > quickstart.csv
          ronin compile examples/maquinas.ronin -o quickstart.ir.json
          ronin simulate examples/maquinas.ronin --steps 100 --seed 42 > quickstart-simulate.json
          ronin diagnose examples/maquinas.ronin > quickstart-diagnose.json
          ronin check examples/pesca.ronin
          ronin solve examples/pesca.ronin > quickstart-pesca.json
          python -c "import csv, json; from pathlib import Path; json.loads(Path('quickstart-solve.json').read_text()); json.loads(Path('quickstart-run.json').read_text()); json.loads(Path('quickstart-simulate.json').read_text()); json.loads(Path('quickstart-diagnose.json').read_text()); json.loads(Path('quickstart-pesca.json').read_text()); json.loads(Path('quickstart.ir.json').read_text()); rows=list(csv.reader(Path('quickstart.csv').open())); assert rows[0] == ['system','agent_index','model','fitness','allocation']; assert len(rows) == 3"

  rust-runtime:
    name: Rust runtime / conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust / parser conformance
        run: "cargo test --manifest-path rust/Cargo.toml --lib parser::"
      - name: Rust / solver and numerical contracts
        run: "cargo test --manifest-path rust/Cargo.toml --lib solver::"
      - name: Rust / diagnostic contracts
        run: "cargo test --manifest-path rust/Cargo.toml --lib diagnose::"
      - name: Rust / simulation contracts
        run: "cargo test --manifest-path rust/Cargo.toml --lib simulator::"
      - name: Rust / IR lowering
        run: "cargo test --manifest-path rust/Cargo.toml --lib ir::"
      - name: Rust / CLI integration
        run: cargo test --manifest-path rust/Cargo.toml --bin ronin-core

  cross-runtime-ir:
    name: Python/Rust / JSON IR parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust JSON IR
        run: python scripts/check_ir_parity.py

  cross-runtime-solver:
    name: Python/Rust / numerical solver parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust solver results
        run: python scripts/check_runtime_parity.py
      - name: Stress solver parity with deterministic randomized systems
        run: python scripts/check_randomized_runtime_parity.py


  cross-runtime-simulation-contracts:
    name: Python/Rust / simulation invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare shared simulation invariants
        run: python scripts/check_simulation_contracts.py
      - name: Stress seeded simulation parity on generated systems
        run: python scripts/check_randomized_simulation_parity.py


  cross-runtime-diagnostics:
    name: Python/Rust / diagnostic parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust diagnostic reports
        run: python scripts/check_diagnostic_parity.py


  cross-runtime-csv:
    name: Python/Rust / CSV export parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust CSV exports
        run: python scripts/check_csv_parity.py


  cross-runtime-validation:
    name: Python/Rust / validation CLI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust validation acceptance
        run: python scripts/check_validation_parity.py


  cross-runtime-cli-selection:
    name: Python/Rust / CLI system selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust CLI selection
        run: python scripts/check_cli_selection_parity.py


  cross-runtime-cli-errors:
    name: Python/Rust / CLI error-path parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust CLI error paths
        run: python scripts/check_cli_error_parity.py


  cross-runtime-parser:
    name: Python/Rust / parser acceptance parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compare Python and Rust parser acceptance
        run: python scripts/check_parser_parity.py


  fixture-catalog-traceability:
    name: Conformance fixture catalog / traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test traceability checker
        run: python tests/test_fixture_catalog_checker.py
      - name: Verify fixture catalog and requirement references
        run: python scripts/check_fixture_catalog.py
