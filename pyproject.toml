[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-lang"
version = "0.1.0"
description = "Runtime v0.1 de RONIN basado en MDES v0.5 (Python)"
requires-python = ">=3.9"

[project.scripts]
ronin = "ronin.cli:main"

[tool.setuptools.packages.find]
include = ["ronin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
