[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-lang"
version = "1.1.0"
description = "RONIN 1.1 reference runtime"
requires-python = ">=3.9"

[project.scripts]
ronin = "ronin.cli:main"

[tool.setuptools.packages.find]
include = ["ronin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
